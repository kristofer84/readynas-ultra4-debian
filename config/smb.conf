#======================= Global Settings =======================
# Rebuilt after the ReadyNASOS -> Debian migration. The original config was
# nothing but frontview includes; the share list came from
# /etc/frontview/samba/Shares.conf, and every share was 'guest ok'.
#
# `youruser` is a placeholder: Samba passwords live in the tdb, not here, so
# each share needs one `smbpasswd -a` after this file is in place.
#
# Guest access is NOT recreated: Windows 10/11 refuse guest auth over
# SMB2 by default and macOS warns, so it would simply fail today.
# Authentication is per-user instead.

[global]
   workgroup = WORKGROUP
   netbios name = NAS
   server string = ReadyNAS
   server role = standalone server
   security = user
   map to guest = never

   # SMB1 is dead and disabled by default in modern clients.
   server min protocol = SMB2_10

   # macOS / Finder interop: resource forks, Finder metadata, and
   # characters that are legal on HFS+ but not on POSIX.
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = RackMount
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

   # This machine has two threads and 4 GB; keep logging modest.
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000

   create mask = 0664
   directory mask = 0775

#======================= Share Definitions =====================

[other]
   path = /raid/other
   valid users = youruser
   writeable = yes
   browseable = yes

[lykke]
   path = /raid/lykke
   valid users = youruser
   writeable = yes
   browseable = yes
   follow symlinks = yes

[rls]
   path = /raid/rls
   valid users = youruser
   writeable = yes
   browseable = yes

[cloud]
   # OneDrive syncs this directory bidirectionally: anything deleted here
   # is deleted from the Microsoft account too. Read-only by default for
   # the same reason the NFS export to the other hosts is read-only.
   # Flip 'read only' to no if you want to manage files from a laptop.
   path = /raid/cloud
   valid users = youruser
   read only = yes
   browseable = yes
