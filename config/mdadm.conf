# Generate with `mdadm --detail --scan` and keep HOMEHOST <ignore>, or the
# initramfs has nothing to assemble the root array with. The array UUIDs are the
# reference machine's.
HOMEHOST <ignore>
ARRAY /dev/md/0 metadata=1.2 UUID=e5d83157:ecc2b96b:34260b7d:071c7c09
ARRAY /dev/md/1 metadata=1.2 UUID=3d3a7df9:f13051b9:a554536f:6b53ee9e
ARRAY /dev/md/raid-0 metadata=1.2 UUID=7d79af45:72c6f794:68097054:764dbb9b

# Without PROGRAM or MAILADDR, mdmonitor.service refuses to start at all:
# "No mail address or alert command - not monitoring". See ../scripts/md-event.
PROGRAM /usr/local/sbin/md-event
