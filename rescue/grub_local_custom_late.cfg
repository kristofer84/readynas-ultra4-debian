# Extra entry, only reachable if a serial console is attached.
# 'toram' frees the boot medium so it can be repartitioned in place.
menuentry "grml-full-amd64 2026.09 [toram + ssh]  (ReadyNAS test)" {
    set gfxpayload=keep
    echo 'Loading kernel (toram)...'
    linux   /boot/grmlfullamd64/vmlinuz apm=power-off boot=live live-media-path=/live/grml-full-amd64/ bootid=grmlfullamd64202609 "${loopback}" nomce toram ssh=CHANGEME scripts hostname=grmlnas noeject noprompt console=tty0 console=ttyS0,115200n8
    echo 'Loading initrd...'
    initrd  /boot/grmlfullamd64/initrd.img
}
