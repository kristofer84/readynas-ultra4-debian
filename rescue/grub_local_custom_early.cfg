# Added for the ReadyNAS headless boot test (this machine has no VGA output).
# Sourced by grub.cfg before header.cfg; $kernelopts is appended to the
# default menu entry's linux line.
#
#   ssh=       start sshd and set this password for root and the grml user
#   scripts    run /run/live/medium/scripts/grml.sh  (brings up DHCP — grml
#              does NOT configure networking by itself)
#   hostname=  identify the box to DHCP/DNS
#   console=   mirror to the internal serial header; harmless if unattached
set kernelopts="ssh=changeme scripts hostname=grmlnas noeject noprompt console=tty0 console=ttyS0,115200n8"
export kernelopts
